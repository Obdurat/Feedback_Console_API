app = "bolt-tms-api"
primary_region = "gru" # São Paulo — closest to you

[build]

[env]
  NODE_ENV = "production"
  PORT = "3333"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1